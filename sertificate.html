<!DOCTYPE html>

    <!-- SERTIFICATE -->
    <section class="sertificate" id="sertificate">

      <div class="sertificate-container">
        <div class="certificate-item">

              <img src="img/sertificate1.png" alt="Certificate" />
            </div>
          </div>
          <button type="button" class="certificate-view-btn" onclick="openCertificate('certificate1')">View Certificate</button>

    <!-- CERTIFICATE MODAL -->
    <div class="certificate-modal" id="certificateModal">
      <div class="certificate-modal-content">

        <!-- CLOSE BUTTON -->
        <button type="button" class="certificate-modal-close" id="certificateModalClose" aria-label="Tutup">&times;</button>

        <!-- CERTIFICATE IMAGE -->
        <div class="modal-certificate-image">
          <img src="" id="certificateModalImage" alt=""/>
        </div>

        <!-- CERTIFICATE INFORMATION -->
        <div class="modal-certificate-info">

          <span
            class="modal-certificate-label"
            id="certificateModalLabel"
          >
            Sertificate
          </span>

          <h3 id="certificateModalTitle">
            Nama Sertificate
          </h3>

          <p id="certificateModalIssuer">
            Penyelenggara
          </p>


          <!-- BUTTON -->
          <div class="modal-certificate-buttons">

            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="modal-certificate-btn primary-certificate-btn"
              id="certificateModalLink"
            >
              <i class="bx bx-file"></i>
              View Sertificate
            </a>

            <button
              type="button"
              class="modal-certificate-btn secondary-certificate-btn"
              id="certificateModalOk"
            >
              Tutup
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- END CERTIFICATE MODAL -->
